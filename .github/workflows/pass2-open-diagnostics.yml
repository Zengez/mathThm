name: Pass 2 open-case diagnostic
on:
  push:
    paths:
      - .github/workflows/pass2-open-diagnostics.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit contexts and remaining structure without proofs
        run: python scripts/pass2_open_diagnostics.py
      - name: Persist bounded diagnostic without modifying candidate decisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/PASS2_OPEN_DIAGNOSTICS_2026-10-28.json
          git diff --cached --quiet || (git commit -m "Inventory remaining Pass 2 source-context and structure cases" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-open-case-diagnostic
          path: harvest/PASS2_OPEN_DIAGNOSTICS_2026-10-28.json
          retention-days: 90
