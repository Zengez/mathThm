name: Pass 2 structural-only continuation and deferred context archive
on:
  push:
    paths:
      - .github/workflows/pass2-structural-only-archive.yml
      - scripts/pass2_structural_refined.py
      - scripts/pass2_problem_candidates.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-pass2:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run existing regressions
        run: python -m unittest discover -s tests -q
      - name: Split safe structural candidates only
        run: python -m scripts.pass2_structural_refined
      - name: Refresh canonical queues
        run: python -m scripts.pass2_resume_queues
      - name: Archive all inherited-context problems separately
        run: python -m scripts.pass2_problem_candidates
      - name: Verify canonical totals, equivalences, archive and active exclusions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from scripts import harvest_pipeline as p
          root=Path("harvest/batches")
          batches=["stacks-bulk-2026-10-28","stacks-second-2026-10-28","stacks-remaining-2026-10-28"]
          allcounts=Counter()
          allids=set()
          for name in batches:
            w=root/name
            before=p.load_rows(w/"pass1.jsonl","candidate_id")
            after=p.load_rows(w/"pass2.jsonl","candidate_id")
            assert set(before)==set(after)
            assert not set(after).intersection(allids)
            allids.update(after)
            assert not p.load_rows(w/"pass3.jsonl","candidate_id")
            allcounts.update(x["context_status"] for x in after.values())
            for v in after.values():
              if v["context_status"]=="resolved":
                assert v["hypotheses"] and v["conclusions"]
                assert v["result_classification"]=="mathematical_result"
                if v.get("logical_form","").startswith("equivalence") or "equivalence" in v.get("logical_form",""):
                  assert all(s in v["hypotheses"] and s in v["conclusions"]
                             for group in v.get("equivalence_sides",[]) for s in group)
          assert len(allids)==10987
          assert allcounts["needs_context"]==862
          assert allcounts["needs_classification"]==3
          assert allcounts["needs_structure"]<=475
          manifest=json.loads(Path("harvest/PROBLEM_CANDIDATES_MANIFEST.json").read_text())
          groups=manifest.get("by_difficulty",{"inherited_context":allcounts["needs_context"]})
          assert groups["inherited_context"]==allcounts["needs_context"]
          assert groups.get("structural_complexity",0)==(allcounts["needs_structure"] if "by_difficulty" in manifest else 0)
          assert manifest["count"]==sum(groups.values())==sum(manifest["by_batch"].values())
          queue=[json.loads(q) for q in Path("harvest/problem_candidates_inherited_context.jsonl").read_text().splitlines()]
          assert len(queue)==manifest["count"] and len({q["candidate_id"] for q in queue})==len(queue)
          assert all(q["original_status"] in ("needs_context","needs_structure") for q in queue)
          if "by_difficulty" in manifest:
            assert all(q["difficulty_group"] in ("inherited_context","structural_complexity") for q in queue)
          inventory=json.loads(Path("harvest/PASS2_RESUME_INVENTORY_2026-10-28.json").read_text())
          assert inventory["all_statuses"]==dict(sorted(allcounts.items()))
          assert not any(x["candidate_id"] in {v["candidate_id"] for v in queue}
                         for name in batches for x in p.load_rows(root/name/"pass2.jsonl","candidate_id").values()
                         if x["context_status"]=="resolved")
          print(json.dumps({"candidates":len(allids),"after":dict(sorted(allcounts.items())),
                            "archive":manifest["count"]},indent=2))
          PY
      - name: Commit Pass 2 decisions and future-discovery problem registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28 harvest/batches/stacks-remaining-2026-10-28 harvest/PASS2_RESUME_INVENTORY_2026-10-28.json harvest/problem_candidates_inherited_context.jsonl harvest/PROBLEM_CANDIDATES_MANIFEST.json
          if [ -f harvest/problem_candidates.jsonl ]; then git add harvest/problem_candidates.jsonl; fi
          if ! git diff --cached --quiet; then
            git commit -m "Pass 2: resolve structural candidates and archive context-blocked problems"
            git pull --rebase origin main
            git push origin main
          fi
