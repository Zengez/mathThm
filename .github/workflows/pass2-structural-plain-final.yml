name: Pass 2 plain structural final bounded review
on:
  push:
    paths:
      - .github/workflows/pass2-structural-plain-final.yml
      - scripts/pass2_structural_plain.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pass2:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all existing regression tests
        run: python -m unittest discover -s tests -q
      - name: Process plain-source structural cases only
        run: python -m scripts.pass2_structural_plain
      - name: Refresh all canonical queues and deferred problem registry
        run: |
          python -m scripts.pass2_resume_queues
          python -m scripts.pass2_problem_candidates
      - name: Confirm no inherited-context or classification changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("harvest/PASS2_STRUCTURAL_PLAIN_FINAL_2026-10-28.json").read_text())
          i=json.loads(Path("harvest/PASS2_RESUME_INVENTORY_2026-10-28.json").read_text())
          m=json.loads(Path("harvest/PROBLEM_CANDIDATES_MANIFEST.json").read_text())
          assert d["statuses"]==i["all_statuses"]
          assert d["statuses"]["needs_context"]==m["count"]==862
          assert d["statuses"]["needs_classification"]==3
          assert d["statuses"]["needs_structure"]<=453
          assert sum(d["statuses"].values())==10987
          assert not d["proofs_read"] and d["published_catalog_untouched"]
          PY
      - name: Persist only decisions, current queues and final summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28 harvest/batches/stacks-remaining-2026-10-28 harvest/PASS2_RESUME_INVENTORY_2026-10-28.json harvest/PASS2_STRUCTURAL_PLAIN_FINAL_2026-10-28.json harvest/PROBLEM_CANDIDATES_MANIFEST.json harvest/problem_candidates_inherited_context.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Pass 2: finish bounded plain-source structural review"
            git pull --rebase origin main
            git push origin main
          fi
