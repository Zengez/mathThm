name: Build minimal Stacks section and label index
on:
  push:
    paths:
      - .github/workflows/build-stacks-light-context-index.yml
      - scripts/stacks_context_light_index.py
      - tests/test_stacks_context_light_index.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: stacks/stacks-project
          ref: a04446e57ec1fbc252a871afcec7752fb2807b14
          path: upstream/stacks
          persist-credentials: false
      - run: test "$(git -C upstream/stacks rev-parse HEAD)" = "a04446e57ec1fbc252a871afcec7752fb2807b14"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bounded section openings and exact label locator
        run: python -m scripts.stacks_context_light_index --source-root upstream/stacks
      - name: Run full regression suite
        run: python -m unittest discover -s tests -q
      - name: Assert source fidelity and no destructive changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import harvest_pipeline as p
          from scripts.stacks_context_light_index import exact_label,candidate_context_bundle
          m=json.loads(Path("harvest/stacks_context_light_index_manifest_2026-10-28.json").read_text())
          rows=p.read_jsonl(Path("harvest/stacks_context_openings_2026-10-28.jsonl"))
          labels=json.loads(Path("harvest/stacks_context_labels_2026-10-28.json").read_text())
          assert m["chapters_scanned"]==115
          assert m["section_openings"]==len(rows)>1000
          assert m["source_labels_indexed"]>=10000
          assert m["unique_full_label_keys"]==len(labels["by_full_label"])
          assert all(q["source_revision"]==m["source_revision"] for q in rows)
          assert not m["candidate_statements_modified"]
          assert not m["hypotheses_inferred"]
          assert not m["theorem_proofs_read"]
          assert not m["recursive_context_research"]
          assert exact_label("morphisms","schemes-definition-immersion")["status"]=="resolved_exact"
          assert candidate_context_bundle("formal-spaces.tex",500)["status"]=="lookup_leads_only"
          print({k:m[k] for k in ("chapters_scanned","section_openings","source_labels_indexed",
              "opening_previews_truncated","duplicate_full_labels")})
          PY
      - name: Commit only mechanical Stacks lookup products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/stacks_context_openings_2026-10-28.jsonl harvest/stacks_context_labels_2026-10-28.json harvest/stacks_context_light_index_manifest_2026-10-28.json harvest/stacks_context_light_index_summary_2026-10-28.md
          test -z "$(git diff --name-only -- data/theorems.json harvest/batches harvest/active_candidate_ids.jsonl)"
          if ! git diff --cached --quiet; then
            git commit -m "Save source-only section opening and exact Stacks label lookup"
            git pull --rebase origin main
            git push origin main
          fi
