name: Capture local mathematical definitions for consecutive 150-candidate run
on:
  push:
    paths:
      - .github/workflows/extract-scale150-local-context.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: stacks/stacks-project
          ref: a04446e57ec1fbc252a871afcec7752fb2807b14
          path: upstream/stacks
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.stacks_scale150_context_passages
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/section_walk_scale150_2026-10-28/SHARED_CONTEXT_EXCERPTS.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Capture local definitions actually needed for the 150-candidate consecutive run"
            git pull --rebase origin main
            git push origin main
          fi
