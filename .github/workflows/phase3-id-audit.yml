name: Audit reconciled Phase 3 candidate IDs
on:
  push:
    branches:
      - work/phase3/parallel-reconciled
    paths:
      - scripts/phase3_id_audit.py
      - scripts/phase3_source_digest_repair.py
      - .github/workflows/phase3-id-audit.yml
      - work/phase3-parallel/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct invalid source checksum metadata without changing mathematical content
        run: python scripts/phase3_source_digest_repair.py
      - name: Audit every frozen Stage B positive ID and Phase 3 worker output
        run: python scripts/phase3_id_audit.py --report phase3-id-audit-result.json
      - name: Commit audited metadata-only corrections to integration branch
        run: |
          if ! git diff --quiet -- work/phase3-parallel/worker-*/phase2_proposals; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add work/phase3-parallel/worker-*/phase2_proposals
            git commit -m 'Correct 117 Phase 3 proposal SHA256 fields after full frozen ID audit'
            git push origin HEAD:refs/heads/work/phase3/parallel-reconciled
          else
            echo 'No proposal metadata corrections needed.'
          fi
      - name: Archive machine-readable audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-id-audit
          path: phase3-id-audit-result.json
          if-no-files-found: warn
