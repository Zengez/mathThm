name: Inspect matched mathThm duplicate candidates
on:
  push:
    paths:
      - .github/workflows/review-duplicate-candidates.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.review_duplicate_candidates
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/DUPLICATE_GROUP_REVIEW_2026-10-28.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Capture 102 duplicate-group source comparisons"
            git pull --rebase origin main
            git push origin main
          fi
