name: Validate 150 consecutive Algebra standalone source-context drafts
on:
  push:
    paths:
      - .github/workflows/validate-stacks-section-walk-scale150.yml
      - scripts/validate_stacks_section_walk_scale150.py
      - harvest/section_walk_scale150_2026-10-28/SCOPES_REVIEWED.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 150 candidates, all source scope environments and 19 consecutive sections
        run: python -m scripts.validate_stacks_section_walk_scale150
      - name: Full Python regression suite
        run: python -m unittest discover -s tests -q
      - name: Preserve completed section checkpoints and validated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/section_walk_scale150_2026-10-28/SECTION_CHECKPOINTS.jsonl harvest/section_walk_scale150_2026-10-28/VALIDATION.json
          test -z "$(git diff --name-only -- data/theorems.json harvest/batches harvest/active_candidate_ids.jsonl)"
          if ! git diff --cached --quiet; then
            git commit -m "Save validated full-section checkpoints for 150 consecutive Algebra theorem drafts"
            git pull --rebase origin main
            git push origin main
          fi
