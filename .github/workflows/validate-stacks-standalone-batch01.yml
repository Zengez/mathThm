name: Validate standalone expansion batch 01
on:
  push:
    paths:
      - .github/workflows/validate-stacks-standalone-batch01.yml
      - scripts/validate_standalone_expansion_batch01.py
      - harvest/standalone_candidate_expansion_batch01_2026-10-28.jsonl
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check against all original Pass 1 and Pass 2 candidate records
        run: python -m scripts.validate_standalone_expansion_batch01
      - name: Full test suite
        run: python -m unittest discover -s tests -q
      - name: Commit batch validation manifest (no candidate promotion)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/standalone_candidate_expansion_batch01_2026-10-28_manifest.json
          test -z "$(git diff --name-only -- data/theorems.json harvest/batches harvest/active_candidate_ids.jsonl)"
          if ! git diff --cached --quiet; then
            git commit -m "Verify 13 standalone expansion records against original Stacks candidate sources"
            git pull --rebase origin main
            git push origin main
          fi
