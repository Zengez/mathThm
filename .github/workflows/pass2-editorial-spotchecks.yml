name: Apply bounded Pass 2 editorial spot-checks
on:
  push:
    paths:
      - .github/workflows/pass2-editorial-spotchecks.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified-in-statement-only twenty editorial edits
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from argparse import Namespace
          from scripts import harvest_pipeline as p
          review=json.loads(Path('harvest/pass2_editorial_spotchecks.json').read_text())['decisions']
          outstanding={d['candidate_id']:d for d in review}
          if len(outstanding)!=len(review):
              raise ValueError('Duplicate spot-check IDs')
          total=0

          for batch in ('stacks-bulk-2026-10-28','stacks-second-2026-10-28'):
              w=Path('harvest/batches')/batch
              current=p.load_rows(w/'pass2.jsonl','candidate_id')
              decisions=[]
              for ident,d in list(outstanding.items()):
                  if ident not in current:
                      continue
                  old=current[ident]
                  if not old['statement'].startswith(d['expect_prefix']):
                      raise ValueError(f'Unexpected source statement for {ident}')
                  updated={
                      **old,
                      'candidate_id':ident,
                      'context_status':d['context_status'],
                      'context_note':d['review_note'] if d['context_status']!='resolved' else '',
                      'result_classification':'mathematical_result',
                      'review_method':'editorial',
                      'split_confidence':'light_statement_review',
                      'hypotheses':d.get('hypotheses',[]),
                      'conclusions':d.get('conclusions',[]),
                      'statement_editorial_notes':d['review_note'],
                  }
                  decisions.append(updated)
                  del outstanding[ident]
              if decisions:
                  path=w/'pass2_editorial_decisions.jsonl'
                  p.atomic_text(path,''.join(json.dumps(d,ensure_ascii=False,sort_keys=True)+'\n' for d in decisions))
                  p.apply_pass2(Namespace(workdir=str(w),decisions=str(path),replace=True))
                  total+=len(decisions)
                  counts=Counter(x['context_status'] for x in p.load_rows(w/'pass2.jsonl','candidate_id').values())
                  p.atomic_text(w/'pass2_editorial_summary.json',
                      json.dumps({'spotchecks_applied':len(decisions),
                        'updated_context_status':dict(sorted(counts.items())),
                        'proofs_read':False,'review_scope':'statement_only_light_editorial'},indent=2)+'\n')
          if outstanding:
              raise ValueError(f'Spotcheck IDs not found in either raw batch: {sorted(outstanding)}')
          print(json.dumps({'editorial_spotchecks_applied':total,'proofs_read':False}))
          PY
      - name: Commit editorial Pass 2 adjustments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches
          git diff --cached --quiet || (git commit -m "Refine 20 Pass 2 statement classifications (no proof scans)" && git push)
