name: Select new consecutive 270-330 Stacks candidates
on:
  push:
    paths:
      - .github/workflows/select-stacks-sections-scale300.yml
      - scripts/stacks_consecutive_section_window300.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enumerate complete consecutive sections outside completed registry
        run: python -m scripts.stacks_consecutive_section_window300
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/section_walk_scale300_2026-10-28/SELECTION_OPTIONS.json
          if ! git diff --cached --quiet; then
            git commit -m "Save 270–330 candidate consecutive Stacks section choices"
            git pull --rebase origin main
            git push origin main
          fi
