name: Pass 3 surface duplicate precheck
on:
  push:
    paths:
      - .github/workflows/pass3-surface-duplicate-precheck.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.pass3_surface_duplicate_precheck
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/PASS3_PRECHECK_SURFACE_DUPLICATES_2026-10-28.json
          git diff --cached --quiet || (git commit -m "Record Pass 3 surface duplicate scan" && git pull --rebase origin main && git push origin main)
