name: Capture local source contexts for 300 consecutive Stacks candidates
on:
  push:
    paths:
      - .github/workflows/extract-stacks-scale300-local-context.yml
      - scripts/stacks_scale300_context_passages.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: stacks/stacks-project
          ref: a04446e57ec1fbc252a871afcec7752fb2807b14
          path: upstream/stacks
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract actual named contexts in both chapters
        run: python -m scripts.stacks_scale300_context_passages
      - name: Save only source-grounded context excerpts and openings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/section_walk_scale300_2026-10-28/SHARED_CONTEXT_EXCERPTS.jsonl harvest/section_walk_scale300_2026-10-28/SECTION_OPENINGS.jsonl harvest/section_walk_scale300_2026-10-28/CONTEXT_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "Save source definitions and scope leads in consecutive 300-candidate run"
            git pull --rebase origin main
            git push origin main
          fi
