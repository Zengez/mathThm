name: Validate scoped Limits standalone statements
on:
  push:
    paths:
      - .github/workflows/validate-stacks-section-walk-limits.yml
      - scripts/validate_section_walk_limits.py
      - harvest/SECTION_WALK_PILOT_LIMITS_STANDALONE_REVIEWS_2026-10-28.jsonl
      - harvest/SECTION_WALK_PILOT_LIMITS_SHARED_CONTEXT_2026-10-28.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source order, persistent Situation and per-lemma local finiteness
        run: python -m scripts.validate_section_walk_limits
      - name: Full Python regression suite
        run: python -m unittest discover -s tests -q
      - name: Commit contextual checkpoint and metrics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/SECTION_WALK_PILOT_LIMITS_CONTEXT_CHECKPOINTS_2026-10-28.jsonl harvest/SECTION_WALK_PILOT_LIMITS_VALIDATION_2026-10-28.json
          test -z "$(git diff --name-only -- data/theorems.json harvest/batches harvest/active_candidate_ids.jsonl)"
          if ! git diff --cached --quiet; then
            git commit -m "Validate durable and local scope transitions in Limits theorem batch"
            git pull --rebase origin main
            git push origin main
          fi
