name: Batch entire Stacks sections near 75 candidates
on:
  push:
    paths:
      - .github/workflows/batch-stacks-section-walk-scale74.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  section-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: stacks/stacks-project
          ref: a04446e57ec1fbc252a871afcec7752fb2807b14
          path: upstream/stacks
          persist-credentials: false
      - run: test "$(git -C upstream/stacks rev-parse HEAD)" = "a04446e57ec1fbc252a871afcec7752fb2807b14"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Process five full sections in source order, no proofs
        run: python -m scripts.stacks_section_walk_scale74
      - name: Check complete section manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import harvest_pipeline as p
          root=Path("harvest/section_walk_scale74_2026-10-28")
          m=json.loads((root/"MANIFEST.json").read_text())
          assert m["section_count"]==5 and m["actual_candidate_count"]==74
          ids=set()
          for s in m["sections"]:
              packets=p.read_jsonl(Path(s["packets_path"]))
              events=p.read_jsonl(Path(s["events_path"]))
              assert len(packets)==s["candidate_count"]
              assert sum(e["kind"]=="candidate_location" for e in events)==len(packets)
              assert sum(e["kind"]=="enter_local_environment" for e in events)==sum(e["kind"]=="exit_local_environment" for e in events)
              for r in packets:
                  assert r["candidate_id"] not in ids
                  ids.add(r["candidate_id"])
          assert len(ids)==74
          print("Five whole sections and 74 distinct original candidates located")
          PY
      - name: Run full unit regression suite
        run: python -m unittest discover -s tests -q
      - name: Commit section packets without altering Pass 1/2 or published data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/section_walk_scale74_2026-10-28/
          test -z "$(git diff --name-only -- data/theorems.json harvest/batches harvest/active_candidate_ids.jsonl)"
          if ! git diff --cached --quiet; then
            git commit -m "Save five complete Stacks Morphisms sections and 74 candidate scope packets"
            git pull --rebase origin main
            git push origin main
          fi
