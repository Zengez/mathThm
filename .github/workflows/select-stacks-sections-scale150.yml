name: Select consecutive 140–160 candidate Stacks section run
on:
  push:
    paths:
      - .github/workflows/select-stacks-sections-scale150.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.stacks_consecutive_section_window150
      - name: Save ranked windows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/section_walk_scale150_2026-10-28/SELECTION_OPTIONS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record candidate windows of consecutive complete Stacks sections"
            git pull --rebase origin main
            git push origin main
          fi
