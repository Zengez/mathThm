name: Reconcile Wikipedia Stage A editorial decisions

on:
  push:
    branches: [work/wikipedia-stage-a-reconciled-20261104]
    paths:
      - '.github/workflows/reconcile-wikipedia-stage-a.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-wikipedia-stage-a-20261104
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout coordinator branch
        uses: actions/checkout@v4
        with:
          ref: work/wikipedia-stage-a-reconciled-20261104
          path: coordinator
          persist-credentials: true
      - name: Read independent worker 1 decisions
        uses: actions/checkout@v4
        with:
          ref: work/wikipedia-stage-a/worker-1
          path: worker-inputs/worker-1
          persist-credentials: false
          sparse-checkout: work/wikipedia-stage-a/20261103/worker-1/editorial_decisions.jsonl
          sparse-checkout-cone-mode: false
      - name: Read independent worker 2 decisions
        uses: actions/checkout@v4
        with:
          ref: work/wikipedia-stage-a/worker-2
          path: worker-inputs/worker-2
          persist-credentials: false
          sparse-checkout: work/wikipedia-stage-a/20261103/worker-2/editorial_decisions.jsonl
          sparse-checkout-cone-mode: false
      - name: Read independent worker 3 decisions
        uses: actions/checkout@v4
        with:
          ref: work/wikipedia-stage-a/worker-3
          path: worker-inputs/worker-3
          persist-credentials: false
          sparse-checkout: work/wikipedia-stage-a/20261103/worker-3/editorial_decisions.jsonl
          sparse-checkout-cone-mode: false
      - name: Read independent worker 4 decisions
        uses: actions/checkout@v4
        with:
          ref: work/wikipedia-stage-a/worker-4
          path: worker-inputs/worker-4
          persist-credentials: false
          sparse-checkout: work/wikipedia-stage-a/20261103/worker-4/editorial_decisions.jsonl
          sparse-checkout-cone-mode: false
      - name: Reconcile 1121 editorial decisions without re-review
        run: |
          python coordinator/scripts/reconcile_wikipedia_stage_a.py \
            --sources coordinator/work/wikipedia-stage-a/20261103 \
            --worker-root worker-inputs \
            --output coordinator/work/wikipedia-stage-a/20261103/reconciled
          cat coordinator/work/wikipedia-stage-a/20261103/reconciled/REPORT.json
      - name: Commit canonical Wikipedia Stage A decisions and holds
        working-directory: coordinator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/wikipedia-stage-a/20261103/reconciled
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile Wikipedia Stage A: 984 prepared, 137 retained holds"
            git push origin HEAD:work/wikipedia-stage-a-reconciled-20261104
          fi
      - name: Upload reconciliation output
        uses: actions/upload-artifact@v4
        with:
          name: wikipedia-stage-a-reconciled
          path: coordinator/work/wikipedia-stage-a/20261103/reconciled
          retention-days: 45
          if-no-files-found: error
