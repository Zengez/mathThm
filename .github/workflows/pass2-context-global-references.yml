name: Pass 2 pinned global inherited source context
on:
  push:
    paths:
      - .github/workflows/pass2-context-global-references.yml
      - scripts/pass2_context_global_refs.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pass2-context:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All current Pass 2 regression tests
        run: python -m unittest discover -s tests -q
      - name: Fetch and pin original Stacks source
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --filter=blob:none https://github.com/stacks/stacks-project.git upstream/stacks
          REF=a04446e57ec1fbc252a871afcec7752fb2807b14
          if [ "$(git -C upstream/stacks rev-parse HEAD)" != "$REF" ]; then
            git -C upstream/stacks fetch --quiet --depth 1 origin "$REF"
            git -C upstream/stacks checkout --quiet --detach "$REF"
          fi
          test "$(git -C upstream/stacks rev-parse HEAD)" = "$REF"
      - name: Recover all exact eligible context references across the Stacks source
        run: python -m scripts.pass2_context_global_refs --source-root upstream/stacks
      - name: Regenerate only canonical unresolved queues and totals
        run: python -m scripts.pass2_resume_queues
      - name: Assert only inherited-context cases changed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('harvest/PASS2_CONTEXT_GLOBAL_REPORT_2026-10-28.json').read_text())
          assert sum(x['before_context'] for x in o['batches']) == 948
          assert all(x['before_context']-x['after_context']==x['newly_resolved'] for x in o['batches'])
          assert o['status_totals']['needs_structure']==475
          assert o['status_totals']['needs_classification']==3
          assert not o['proofs_read'] and not o['pass3_started']
          inventory=json.loads(Path('harvest/PASS2_RESUME_INVENTORY_2026-10-28.json').read_text())
          assert inventory['all_statuses']==o['status_totals']
          PY
      - name: Commit only Pass 2 decisions and deferred queues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28 harvest/batches/stacks-remaining-2026-10-28 harvest/PASS2_RESUME_INVENTORY_2026-10-28.json harvest/PASS2_CONTEXT_GLOBAL_REPORT_2026-10-28.json
          if ! git diff --cached --quiet; then
            git commit -m "Pass 2: resolve pinned named inherited Stacks contexts"
            git pull --rebase origin main
            git push origin main
          fi
