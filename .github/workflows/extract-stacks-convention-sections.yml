name: Extract pinned Stacks designated convention sections
on:
  push:
    paths:
      - .github/workflows/extract-stacks-convention-sections.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: stacks/stacks-project
          ref: a04446e57ec1fbc252a871afcec7752fb2807b14
          path: upstream/stacks
          persist-credentials: false
      - run: test "$(git -C upstream/stacks rev-parse HEAD)" = "a04446e57ec1fbc252a871afcec7752fb2807b14"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.stacks_context_sections --source-root upstream/stacks
      - name: Check source-only review packet coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(line) for line in Path("harvest/stacks_context_sections_2026-10-28_packets.jsonl").read_text().splitlines()]
          assert len(rows)>=45
          assert sum(r["filename"]=="conventions.tex" for r in rows)==5
          assert any(r["filename"]=="stacks-morphisms.tex" for r in rows)
          assert all(r["status"]=="review_packet_not_an_assertion" for r in rows)
          assert len({r["context_id"] for r in rows})==len(rows)
          print(len(rows),len({r["filename"] for r in rows}))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/stacks_context_sections_2026-10-28_packets.jsonl harvest/stacks_context_sections_2026-10-28_manifest.json
          test -z "$(git diff --name-only -- data/theorems.json harvest/batches harvest/active_candidate_ids.jsonl)"
          if ! git diff --cached --quiet; then
            git commit -m "Save bounded pinned-source convention review packets"
            git pull --rebase origin main
            git push origin main
          fi
