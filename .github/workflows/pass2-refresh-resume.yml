name: Refresh current Pass 2 continuation queues
on:
  push:
    paths:
      - .github/workflows/pass2-refresh-resume.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Derive exact remaining queues from canonical Pass 2 data
        run: python -m scripts.pass2_resume_queues
      - name: Commit verified current queues and metrics, no publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28 harvest/batches/stacks-remaining-2026-10-28 harvest/PASS2_RESUME_INVENTORY_2026-10-28.json
          git diff --cached --quiet || (git commit -m "Checkpoint current 10987-candidate Stacks Pass 2 inventory and review queues" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-canonical-resume-inventory
          path: harvest/PASS2_RESUME_INVENTORY_2026-10-28.json
          retention-days: 90
