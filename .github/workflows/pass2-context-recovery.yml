name: Pass 2 recover pinned Stacks Situation contexts
on:
  push:
    paths:
      - .github/workflows/pass2-context-recovery.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests before modifying records
        run: python -m unittest discover -s tests -v
      - name: Fetch exactly pinned Stacks statement source, not proofs
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --filter=blob:none https://github.com/stacks/stacks-project.git upstream/stacks
          REF=a04446e57ec1fbc252a871afcec7752fb2807b14
          if [ "$(git -C upstream/stacks rev-parse HEAD)" != "$REF" ]; then
            git -C upstream/stacks fetch --quiet --depth 1 origin "$REF"
            git -C upstream/stacks checkout --quiet --detach "$REF"
          fi
          test "$(git -C upstream/stacks rev-parse HEAD)" = "$REF"
      - name: Resolve unambiguous named Stacks Situation assumptions for all three batches
        run: python -m scripts.pass2_context_expansion --source-root upstream/stacks
      - name: Check that all candidates remain accounted for and correct equivalences retained
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          from scripts import harvest_pipeline as p
          root=Path('harvest/batches')
          batches=('stacks-bulk-2026-10-28','stacks-second-2026-10-28','stacks-remaining-2026-10-28')
          statuses=Counter()
          summary=[]
          for batch in batches:
              w=root/batch
              raw=p.load_rows(w/'pass1.jsonl','candidate_id')
              current=p.load_rows(w/'pass2.jsonl','candidate_id')
              assert len(raw)==len(current) and set(raw)==set(current)
              cnt=Counter(v['context_status'] for v in current.values())
              for v in current.values():
                  if v['context_status']=='resolved':
                      assert v['hypotheses'] and v['conclusions']
                  if v.get('logical_form','').startswith('equivalence'):
                      assert all(y in v['hypotheses'] and y in v['conclusions']
                                 for side in v.get('equivalence_sides',[]) for y in side)
              assert len(p.load_rows(w/'pass3.jsonl','candidate_id'))==0
              summary.append({'batch':batch,'candidate_count':len(raw),
                              'statuses':dict(sorted(cnt.items()))})
              statuses.update(cnt)
          out={'all_batches':summary,
               'all_candidates':sum(x['candidate_count'] for x in summary),
               'all_statuses':dict(sorted(statuses.items())),
               'proofs_read':False,'pass3_started':False,'publication_changed':False}
          assert out['all_candidates']==10987
          p.atomic_text(Path('harvest/PASS2_ALL_STACKS_CURRENT_2026-10-28.json'),
                         json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Persist only Pass 2 decisions, source-context references, and audit counters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28 harvest/batches/stacks-remaining-2026-10-28 harvest/PASS2_ALL_STACKS_CURRENT_2026-10-28.json
          git diff --cached --quiet || (git commit -m "Pass 2: recover pinned Situation contexts, retain ambiguous cases" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-context-recovery-audit
          path: |
            harvest/batches/*/pass2_context_expansion_summary.json
            harvest/PASS2_ALL_STACKS_CURRENT_2026-10-28.json
          retention-days: 90
