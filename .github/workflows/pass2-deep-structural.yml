name: Pass 2 deeper structural source interpretation
on:
  push:
    paths:
      - .github/workflows/pass2-deep-structural.yml
      - scripts/pass2_deep_structural.py
      - tests/test_pass2_deep_structural.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full Python regression tests before structural review
        run: python -m unittest discover -s tests -v
      - name: Interpret complex source grammar in all three batches
        run: python -m scripts.pass2_deep_structural
      - name: Validate source decisions, conservation and outstanding statuses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from scripts import harvest_pipeline as p
          batches=('stacks-bulk-2026-10-28','stacks-second-2026-10-28','stacks-remaining-2026-10-28')
          allcounts=Counter()
          rows=[]
          for b in batches:
              w=Path('harvest/batches')/b
              raw=p.load_rows(w/'pass1.jsonl','candidate_id')
              current=p.load_rows(w/'pass2.jsonl','candidate_id')
              assert set(raw)==set(current)
              counts=Counter(x['context_status'] for x in current.values())
              allcounts.update(counts)
              for x in current.values():
                  if x['context_status']=='resolved':
                      assert x['hypotheses'] and x['conclusions']
                  if x.get('logical_form','').startswith('equivalence'):
                      assert all(y in x['hypotheses'] and y in x['conclusions']
                                 for side in x.get('equivalence_sides',[]) for y in side)
              assert len(p.load_rows(w/'pass3.jsonl','candidate_id'))==0
              rows.append({'batch':b,'candidates':len(raw),'statuses':dict(sorted(counts.items()))})
          outcome={'batches':rows,'total_candidates':sum(v['candidates'] for v in rows),
                   'statuses':dict(sorted(allcounts.items())),
                   'no_proof_review':True,'no_publication':True}
          assert outcome['total_candidates']==10987
          p.atomic_text(Path('harvest/PASS2_ALL_STACKS_CURRENT_2026-10-28.json'),
                         json.dumps(outcome,indent=2,sort_keys=True)+'\n')
          print(json.dumps(outcome,indent=2,sort_keys=True))
          PY
      - name: Commit revised Pass 2 statement search only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28 harvest/batches/stacks-remaining-2026-10-28 harvest/PASS2_ALL_STACKS_CURRENT_2026-10-28.json
          git diff --cached --quiet || (git commit -m "Pass 2: source-authored structured lists, explicit implications, scoped equivalences" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-deep-structural-summaries
          path: |
            harvest/batches/*/pass2_deep_structural_summary.json
            harvest/PASS2_ALL_STACKS_CURRENT_2026-10-28.json
          retention-days: 90
