name: Stage B calibration regression audit (one-off)
on:
  push:
    branches:
      - audit/stage-b-calibration-regression-20261031
    paths:
      - .github/workflows/stage-b-calibration-regression-20261031.yml
      - scripts/phase2_safe_source.py
      - tests/test_phase2_calibration_safety.py
      - AGENTS.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regression:
    name: Python full regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen calibration base
        run: |
          git merge-base --is-ancestor fbf8e3a23666b5c0025c509b6139c7a5259b96f0 HEAD
          echo "Calibration base is ancestor"
      - name: Run complete Python unittest discovery
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -q > python-regression.log 2>&1
          result=$?
          cat python-regression.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-regression-log
          path: python-regression.log
          if-no-files-found: ignore
  node-unit:
    name: Node unit and UI mock tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run all standalone Node unit tests (browser integration excluded)
        shell: bash
        run: |
          set +e
          node --test tests/test_search.cjs tests/test_definition_links.cjs tests/test_mathdef_v2.cjs tests/test_ui_smoke.cjs > node-regression.log 2>&1
          result=$?
          cat node-regression.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-regression-log
          path: node-regression.log
          if-no-files-found: ignore

  proof-free-source-smoke:
    name: Pinned Stacks proof-free source smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real pinned Stacks chapter masking
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from scripts.phase2_safe_source import mask_source
          rev = "a04446e57ec1fbc252a871afcec7752fb2807b14"
          checks = {
              "flat.tex": (r"\label{lemma-h}", r"\label{remark-how-in-RG}"),
              "more-morphisms.tex": (r"\label{theorem-openness-flatness}", r"\begin{proof}"),
          }
          for name, (required, forbidden) in checks.items():
              url = f"https://raw.githubusercontent.com/stacks/stacks-project/{rev}/{name}"
              with urlopen(url, timeout=30) as response:
                  original = response.read().decode("utf-8")
              masked = mask_source(original)
              assert len(masked.splitlines()) == len(original.splitlines()), name
              assert required in masked, f"{name}: missing expected mathematical statement"
              assert forbidden not in masked, f"{name}: exposed forbidden context"
              assert r"\begin{proof}" not in masked
              assert r"\begin{remark}" not in masked
              print(f"{name}: PASS, {len(masked.splitlines())} line positions retained")
          PY
