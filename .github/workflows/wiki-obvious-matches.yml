name: Fast Wikipedia obvious theorem proof-link match

on:
  push:
    branches:
      - work/wikipedia-obvious-proof-matches-20261103
    paths:
      - '.github/workflows/wiki-obvious-matches.yml'
      - 'scripts/wiki_obvious_matches.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wikipedia-obvious-matches
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout current theorem catalog and matching code
        uses: actions/checkout@v4
        with:
          ref: work/wikipedia-obvious-proof-matches-20261103
          path: source
      - name: Checkout verified Wikipedia accepted URL list
        uses: actions/checkout@v4
        with:
          ref: work/wikipedia-final-binary-review-20261103
          path: wiki
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fast conservative pass over all accepted URLs
        run: |
          python source/scripts/wiki_obvious_matches.py \
            --catalog source/data/theorems.json \
            --accepted wiki/harvest/wikipedia_classification/20261001/final_review/accepted_urls.txt \
            --output source/work/wikipedia-obvious-match-pass \
            --delay 0.2
          cp source/work/wikipedia-obvious-match-pass/wikipedia_proof_links.json \
            source/data/wikipedia_proof_links.json
      - name: Test that proof links persist in regenerated catalog
        working-directory: source
        run: |
          python scripts/publish_phase2_catalog.py --all
          python -m scripts.theorem_schema data/theorems.json
          node --check web/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/wikipedia-obvious-match-pass/REPORT.json').read_text())
          overlay=json.loads(Path('data/wikipedia_proof_links.json').read_text())
          catalog=json.loads(Path('data/theorems.json').read_text())
          links=sum(len(t.get('proof_links', [])) for t in catalog['records'])
          assert report['total_accepted_urls']==1134
          assert report['matched_urls']+report['unmatched_urls']==1134
          assert links == report['matched_urls']
          assert sum(map(len, overlay['links_by_theorem_id'].values())) == links
          print('Confirmed linked proofs:', links, 'Unmatched URLs:', report['unmatched_urls'])
          PY
      - name: Commit persistent link mapping and unmatched queue
        working-directory: source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wikipedia_proof_links.json work/wikipedia-obvious-match-pass/
          if ! git diff --cached --quiet; then
            git commit -m "Record obvious Wikipedia proof matches and all unmatched URL decisions"
            git push origin HEAD:work/wikipedia-obvious-proof-matches-20261103
          fi
      - name: Upload match results
        uses: actions/upload-artifact@v4
        with:
          name: wikipedia-obvious-match-results
          path: source/work/wikipedia-obvious-match-pass
          retention-days: 30
