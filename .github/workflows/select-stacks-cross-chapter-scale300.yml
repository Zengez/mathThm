name: Select 300 candidates across adjacent consecutive chapters
on:
  push:
    paths:
      - .github/workflows/select-stacks-cross-chapter-scale300.yml
      - scripts/stacks_cross_chapter_section_window300.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Choose whole sections and no skipped source between two adjacent chapters
        run: python -m scripts.stacks_cross_chapter_section_window300
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/section_walk_scale300_2026-10-28/CROSS_CHAPTER_SELECTION.json
          if ! git diff --cached --quiet; then
            git commit -m "Record actual cross-chapter consecutive section windows for scale300"
            git pull --rebase origin main
            git push origin main
          fi
