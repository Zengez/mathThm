name: Pass 2 semantic statement QA and requeue
on:
  push:
    paths:
      - .github/workflows/pass2-semantic-qc.yml
      - scripts/pass2_semantic_qc.py
      - tests/test_pass2_semantic_qc.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full Pass 2 regression suite before applying QC
        run: python -m unittest discover -s tests -v
      - name: Requeue ambiguous graph clauses; fix equivalence and closure semantics
        run: python -m scripts.pass2_semantic_qc
      - name: Regenerate exact current queues from canonically corrected records
        run: python -m scripts.pass2_resume_queues
      - name: Validate all Stacks counts, reciprocal equivalences, and no proofs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from scripts import harvest_pipeline as p
          totals=Counter()
          for b in ('stacks-bulk-2026-10-28','stacks-second-2026-10-28','stacks-remaining-2026-10-28'):
              w=Path('harvest/batches')/b
              a=p.load_rows(w/'pass1.jsonl','candidate_id')
              c=p.load_rows(w/'pass2.jsonl','candidate_id')
              assert set(a)==set(c)
              assert not p.load_rows(w/'pass3.jsonl','candidate_id')
              totals.update(v['context_status'] for v in c.values())
              for v in c.values():
                  if v['context_status']=='resolved':
                      assert v['hypotheses'] and v['conclusions']
                  if 'equivalence' in v.get('logical_form',''):
                      assert all(x in v['hypotheses'] and x in v['conclusions']
                                 for side in v.get('equivalence_sides',[]) for x in side)
          assert sum(totals.values())==10987
          inventory=json.loads(Path('harvest/PASS2_RESUME_INVENTORY_2026-10-28.json').read_text())
          assert totals==Counter(inventory['all_statuses'])
          assert totals['resolved']==9561,totals
          assert totals['needs_structure']==475,totals
          print(json.dumps(dict(sorted(totals.items()))))
          PY
      - name: Persist corrected Pass 2 source evidence and canonical queues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28 harvest/batches/stacks-remaining-2026-10-28 harvest/PASS2_RESUME_INVENTORY_2026-10-28.json
          if ! git diff --cached --quiet; then
            git commit -m "QA Pass 2: correct conjunctive equivalence and requeue ambiguous cases"
            git pull --rebase origin main
            git push origin main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-semantic-qc-final-resume
          path: harvest/PASS2_RESUME_INVENTORY_2026-10-28.json
          retention-days: 90
