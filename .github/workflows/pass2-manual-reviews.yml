name: Apply Pass 2 manual statement reviews
on:
  push:
    paths:
      - .github/workflows/pass2-manual-reviews.yml
      - scripts/pass2_apply_manual_review.py
      - harvest/pass2_manual_statement_review_2026-10-28.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Apply twenty-five bounded editorial splits
        run: python scripts/pass2_apply_manual_review.py
      - name: Save statement records and review queues, no publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28
          git diff --cached --quiet || (git commit -m "Apply 25 light editorial Pass 2 interpretations" && git push)
