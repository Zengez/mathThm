name: Validate 74 candidate whole-section scaling pilot
on:
  push:
    paths:
      - .github/workflows/validate-stacks-section-walk-scale74.yml
      - scripts/validate_stacks_section_walk_scale74.py
      - harvest/section_walk_scale74_2026-10-28/*_reviews.jsonl
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate five complete sections and scoped candidate drafts
        run: python -m scripts.validate_stacks_section_walk_scale74
      - name: Execute all regression tests
        run: python -m unittest discover -s tests -q
      - name: Commit validation metrics and section-complete checkpoints only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/section_walk_scale74_2026-10-28/SECTION_CHECKPOINTS.jsonl harvest/section_walk_scale74_2026-10-28/VALIDATION.json
          test -z "$(git diff --name-only -- data/theorems.json harvest/batches harvest/active_candidate_ids.jsonl)"
          if ! git diff --cached --quiet; then
            git commit -m "Verify all 74 whole-section standalone drafts and save completed-section checkpoints"
            git pull --rebase origin main
            git push origin main
          fi
