name: Pass 2 inherited notation-section source follow-up
on:
  push:
    paths:
      - .github/workflows/pass2-context-global-section.yml
      - scripts/pass2_context_global_section.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full existing Pass 2 test suite
        run: python -m unittest discover -s tests -q
      - name: Pin original Stacks statements and section preambles
        run: |
          git clone --quiet --depth 1 --filter=blob:none https://github.com/stacks/stacks-project.git upstream/stacks
          REF=a04446e57ec1fbc252a871afcec7752fb2807b14
          if [ "$(git -C upstream/stacks rev-parse HEAD)" != "$REF" ]; then
            git -C upstream/stacks fetch --quiet --depth 1 origin "$REF"
            git -C upstream/stacks checkout --quiet --detach "$REF"
          fi
          test "$(git -C upstream/stacks rev-parse HEAD)" = "$REF"
      - name: Recover bounded cross-file notation-section premises only
        run: python -m scripts.pass2_context_global_section --source-root upstream/stacks
      - name: Generate canonical unresolved higher-thinking queues
        run: python -m scripts.pass2_resume_queues
      - name: Verify inherited-context-only scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('harvest/PASS2_CONTEXT_SECTION_FOLLOWUP_2026-10-28.json').read_text())
          assert sum(x['context_before'] for x in r['batches'])==844
          assert r['status_totals']['needs_structure']==475
          assert r['status_totals']['needs_classification']==3
          assert not r['proofs_read'] and r['public_catalog_unchanged']
          i=json.loads(Path('harvest/PASS2_RESUME_INVENTORY_2026-10-28.json').read_text())
          assert i['all_statuses']==r['status_totals']
          PY
      - name: Commit Pass 2 contexts, current queues and summary only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28 harvest/batches/stacks-remaining-2026-10-28 harvest/PASS2_RESUME_INVENTORY_2026-10-28.json harvest/PASS2_CONTEXT_SECTION_FOLLOWUP_2026-10-28.json
          if ! git diff --cached --quiet; then
            git commit -m "Pass 2: extend exact source notation-section context recovery"
            git pull --rebase origin main
            git push origin main
          fi
