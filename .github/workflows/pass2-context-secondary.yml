name: Pass 2 secondary context audit on all Stacks candidates
on:
  push:
    paths:
      - .github/workflows/pass2-context-secondary.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full regression tests before writing decisions
        run: python -m unittest discover -s tests -v
      - name: Read exact pinned Stacks statement sources
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --filter=blob:none https://github.com/stacks/stacks-project.git upstream/stacks
          REF=a04446e57ec1fbc252a871afcec7752fb2807b14
          if [ "$(git -C upstream/stacks rev-parse HEAD)" != "$REF" ]; then
            git -C upstream/stacks fetch --quiet --depth 1 origin "$REF"
            git -C upstream/stacks checkout --quiet --detach "$REF"
          fi
          test "$(git -C upstream/stacks rev-parse HEAD)" = "$REF"
      - name: Recover definition-reference, bibliographical, diagram and named Lemma contexts
        run: python -m scripts.pass2_context_secondary --source-root upstream/stacks
      - name: Check conservation and dual-column search
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from scripts import harvest_pipeline as p
          batches=('stacks-bulk-2026-10-28','stacks-second-2026-10-28','stacks-remaining-2026-10-28')
          allcounts=Counter()
          by=[]
          for b in batches:
              w=Path('harvest/batches')/b
              raw=p.load_rows(w/'pass1.jsonl','candidate_id')
              current=p.load_rows(w/'pass2.jsonl','candidate_id')
              assert set(raw)==set(current)
              assert len(p.load_rows(w/'pass3.jsonl','candidate_id'))==0
              cnt=Counter(x['context_status'] for x in current.values())
              allcounts.update(cnt)
              for x in current.values():
                  if x['context_status']=='resolved':
                      assert x['hypotheses'] and x['conclusions']
                  if x.get('logical_form','').startswith('equivalence'):
                      assert all(s in x['hypotheses'] and s in x['conclusions']
                                 for side in x.get('equivalence_sides',[]) for s in side)
              by.append({'batch':b,'candidates':len(raw),'statuses':dict(cnt)})
          result={'batches':by,'total_candidates':sum(x['candidates'] for x in by),
                  'statuses':dict(sorted(allcounts.items())),
                  'proofs_read':False,'pass3_unchanged':True,'published_catalog_unchanged':True}
          assert result['total_candidates']==10987
          p.atomic_text(Path('harvest/PASS2_ALL_STACKS_CURRENT_2026-10-28.json'),
              json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - name: Commit only latest Pass 2 files, not theorem publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28 harvest/batches/stacks-remaining-2026-10-28 harvest/PASS2_ALL_STACKS_CURRENT_2026-10-28.json
          git diff --cached --quiet || (git commit -m "Pass 2: refine remaining source-context cases in all Stacks batches" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-secondary-context-audit
          path: |
            harvest/batches/*/pass2_context_secondary_summary.json
            harvest/PASS2_ALL_STACKS_CURRENT_2026-10-28.json
          retention-days: 90
