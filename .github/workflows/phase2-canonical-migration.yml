name: Reconcile permanent Phase 2 canonical master (isolated)
on:
  push:
    branches:
      - work/phase2-canonical-migration
    paths:
      - scripts/reconcile_phase2_master.py
      - tests/test_phase2_master_reconciliation.py
      - .github/workflows/phase2-canonical-migration.yml
      - 'work/phase2-canonical-migration/exceptions/worker-*/RESOLUTIONS.jsonl'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-canonical-migration
  cancel-in-progress: false

jobs:
  canonical-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical migration and reconciliation regression tests
        run: python -m unittest tests.test_phase2_master_migration tests.test_phase2_master_reconciliation -v
      - name: Integrate only verified mechanical exception metadata into permanent master
        run: python -m scripts.reconcile_phase2_master --apply
      - name: Validate permanent canonical file, without legacy compatibility loaders
        run: |
          python scripts/migrate_phase2_master.py --validate
          python -m scripts.reconcile_phase2_master --check
      - name: Ensure live site, authority and mathematical evidence are unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff -- data/theorems.json harvest/PHASE2_AUTHORITATIVE_REGISTRY.json)"
          test -s data/maththm_master.jsonl
          test -s work/phase2-canonical-migration/RECONCILIATION_REPORT.json
          test "$(git diff --name-only | grep -v -E '^(data/maththm_master.jsonl|work/phase2-canonical-migration/RECONCILIATION_REPORT.json)$' | wc -l)" -eq 0
      - name: Commit only canonical data and reconciliation report on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/maththm_master.jsonl work/phase2-canonical-migration/RECONCILIATION_REPORT.json
          if git diff --cached --quiet; then
            echo "Canonical evidence already reconciled"
          else
            git commit -m 'Integrate verified Phase 2 exception evidence into permanent master'
            git push origin HEAD:refs/heads/work/phase2-canonical-migration
          fi
      - name: Preserve diagnostic report on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-canonical-reconciliation-diagnostics
          path: |
            work/phase2-canonical-migration/RECONCILIATION_REPORT.json
          if-no-files-found: warn
