name: Draft 150 theorem statements from consecutive Algebra sections
on:
  push:
    paths:
      - .github/workflows/reconstruct-stacks-section-walk-scale150.yml
      - scripts/stacks_section_walk_scale150_reconstruct.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize 150 scoped mathematical hypotheses, conclusions and source-faithful drafts
        run: python -m scripts.stacks_section_walk_scale150_reconstruct
      - name: Verify 150 drafts and 19 complete section outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from scripts import harvest_pipeline as hp
          root=Path("harvest/section_walk_scale150_2026-10-28")
          m=json.loads((root/"DRAFT_MANIFEST.json").read_text())
          assert m["distinct_active_candidates_with_drafts"]==150
          assert m["consecutive_complete_sections"]==19
          ids=set()
          for s in m["per_section"]:
            data=hp.read_jsonl(root/(s["section"]+"_reviews.jsonl"))
            assert len(data)==s["candidates"]
            assert all(x["source_lemma_local_hypotheses_persist_after_end"] is False for x in data)
            assert all(x["standalone_statement_tex"] and x["draft_conclusions"] for x in data)
            assert all(not x["proofs_inspected"] and not x["pass3_eligible"] for x in data)
            for r in data:
              assert r["candidate_id"] not in ids
              ids.add(r["candidate_id"])
          assert len(ids)==150
          print(m["status_counts"])
          PY
      - name: Run full Python regression suite
        run: python -m unittest discover -s tests -q
      - name: Commit standalone review overlays without touching source data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/section_walk_scale150_2026-10-28/s*_reviews.jsonl harvest/section_walk_scale150_2026-10-28/DRAFT_MANIFEST.json
          test -z "$(git diff --name-only -- data/theorems.json harvest/batches harvest/active_candidate_ids.jsonl)"
          if ! git diff --cached --quiet; then
            git commit -m "Save 150 source-ordered standalone draft overlays across 19 consecutive Algebra sections"
            git pull --rebase origin main
            git push origin main
          fi
