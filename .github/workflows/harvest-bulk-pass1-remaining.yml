name: Bulk Pass 1 Stacks remaining chapters
on:
  push:
    paths:
      - .github/workflows/harvest-bulk-pass1-remaining.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover unvisited upstream chapters and extract Pass 1 only
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --filter=blob:none https://github.com/stacks/stacks-project.git upstream/stacks
          REF=$(git -C upstream/stacks rev-parse HEAD)
          test ${#REF} -eq 40
          mkdir -p harvest/batches/stacks-remaining-2026-10-28
          export REF
          python - <<'PY'
          import json, os, pathlib, subprocess
          from scripts.harvest_stacks import discover
          from scripts.harvest_pipeline import merge_rows,save_checkpoint,load_rows,atomic_text
          root=pathlib.Path('upstream/stacks')
          out=pathlib.Path('harvest/batches/stacks-remaining-2026-10-28')
          # Prior workflows, rather than guesswork, define previously attempted chapters.
          attempted={
              'categories.tex','fields.tex','algebra.tex','topology.tex','modules.tex',
              'groups.tex','schemes.tex','comm-algebra.tex','sets.tex','spaces.tex',
              'limits.tex','sheaves.tex','number-theory.tex','groupoids.tex',
              'homology.tex','homotopy.tex','derived.tex','etale.tex','descent.tex',
              'cohomology.tex','varieties.tex','curves.tex','divisors.tex',
              'sites.tex','simplicial.tex','more-algebra.tex'
          }
          # The earlier first run actually yielded fields from only 10 chapters,
          # but reattempting missing/unavailable files is deliberate and reported.
          known_present=set()
          for batch in ('stacks-bulk-2026-10-28','stacks-second-2026-10-28'):
              rows=load_rows(pathlib.Path('harvest/batches')/batch/'pass1.jsonl','candidate_id')
              known_present.update(x['source']['filename'] for x in rows.values())
          all_files=sorted(p for p in root.glob('*.tex') if p.is_file())
          remaining=[p for p in all_files if p.name not in attempted]
          missing_attempts=[p for p in all_files if p.name in attempted and p.name not in known_present]
          selected=remaining+missing_attempts
          records=load_rows(out/'pass1.jsonl','candidate_id')
          by_file={}
          cap=250
          for p in selected:
              if p.stat().st_size>5_000_000:
                  by_file[p.name]={'status':'too_large','new_candidates':0}
                  continue
              text=p.read_text(encoding='utf-8')
              found=list(discover(text,filename=p.name,source_ref=os.environ['REF'],
                   batch='stacks-remaining-2026-10-28',limit=cap))
              new=0
              for x in found:
                  if x['candidate_id'] not in records:
                      records[x['candidate_id']]=x
                      new+=1
              by_file[p.name]={'status':'harvested','new_candidates':new,
                  'cap_reached':len(found)>=cap}
          merge_rows(out/'pass1.jsonl',records.values(),'candidate_id')
          save_checkpoint(out)
          manifest={'source_ref':os.environ['REF'],'mode':'pass1_only',
              'upstream_root_tex_files':len(all_files),
              'previously_attempted_chapters':sorted(attempted),
              'previously_harvested_chapters':sorted(known_present),
              'new_chapters_examined':len(remaining),
              'previously_attempted_but_empty_chapters_rechecked':len(missing_attempts),
              'total_candidates_in_new_batch':len(records),
              'max_candidates_per_file':cap,
              'chapters':by_file,
              'cap_warning':'Chapters at cap may have further results; never assume fully exhausted.',
              'proofs_read':False,'pass2_started':False,'pass3_started':False}
          atomic_text(out/'manifest.json',json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in manifest.items() if k!='chapters'},sort_keys=True))
          PY
      - name: Commit raw candidate batch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-remaining-2026-10-28
          git diff --cached --quiet || (git commit -m "Harvest remaining Stacks chapters as raw Pass 1 only" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: stacks-remaining-pass1
          path: harvest/batches/stacks-remaining-2026-10-28/
          retention-days: 90
