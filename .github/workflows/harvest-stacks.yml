name: Harvest Stacks candidates (Pass 1 only)
on:
  workflow_dispatch:
    inputs:
      source_file:
        description: "One Stacks Project LaTeX chapter"
        required: true
        default: categories.tex
        type: choice
        options:
          - categories.tex
          - fields.tex
          - algebra.tex
          - topology.tex
          - modules.tex
          - groups.tex
          - schemes.tex
      max_candidates:
        description: "Maximum raw candidates from this chapter (1–500)"
        required: true
        default: "100"
        type: string
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch one pinned public Stacks source
        env:
          SOURCE_FILE: ${{ inputs.source_file || 'categories.tex' }}
          MAX_CANDIDATES: ${{ inputs.max_candidates || '20' }}
        run: |
          set -euo pipefail
          case "$SOURCE_FILE" in
            categories.tex|fields.tex|algebra.tex|topology.tex|modules.tex|groups.tex|schemes.tex) ;;
            *) echo "Invalid chapter choice" >&2; exit 1 ;;
          esac
          if ! [[ "$MAX_CANDIDATES" =~ ^[0-9]+$ ]] || \
             (( MAX_CANDIDATES < 1 || MAX_CANDIDATES > 500 )); then
            echo "Maximum candidates must be 1–500" >&2
            exit 1
          fi
          SOURCE_REF=$(git ls-remote https://github.com/stacks/stacks-project.git refs/heads/master | cut -f1)
          if ! [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not pin upstream source revision" >&2; exit 1
          fi
          mkdir -p upstream/stacks
          curl --fail --location --silent --show-error --max-time 75 \
            "https://raw.githubusercontent.com/stacks/stacks-project/$SOURCE_REF/$SOURCE_FILE" \
            -o "upstream/stacks/$SOURCE_FILE"
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "SOURCE_FILE=$SOURCE_FILE" >> "$GITHUB_ENV"
          echo "MAX_CANDIDATES=$MAX_CANDIDATES" >> "$GITHUB_ENV"
      - name: Run low-thought, proof-marker-only Pass 1
        run: |
          python scripts/harvest_stacks.py \
            --source-root upstream/stacks \
            --source-ref "$SOURCE_REF" \
            --files "upstream/stacks/$SOURCE_FILE" \
            --batch-id "stacks-$SOURCE_FILE-$SOURCE_REF" \
            --max-candidates-per-file "$MAX_CANDIDATES" \
            --output-dir "$RUNNER_TEMP/stacks-pass1"
          python scripts/harvest_pipeline.py status --workdir "$RUNNER_TEMP/stacks-pass1"
      - name: Upload candidate files (never the public theorem website)
        uses: actions/upload-artifact@v4
        with:
          name: stacks-raw-candidates
          path: |
            ${{ runner.temp }}/stacks-pass1/pass1.jsonl
            ${{ runner.temp }}/stacks-pass1/checkpoint.json
          if-no-files-found: error
          retention-days: 30
