name: Higher-thinking Pass 2 structural bulk review
on:
  push:
    paths:
      - .github/workflows/pass2-harder-structures.yml
      - scripts/pass2_hard_structures.py
      - tests/test_pass2_hard_structures.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pass2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test theorem collection and statement logical-form parsing
        run: python -m unittest discover -s tests -v
      - name: Interpret source statements in both 827-item higher-thinking queues
        run: |
          set -euo pipefail
          python scripts/pass2_hard_structures.py --workdir harvest/batches/stacks-bulk-2026-10-28
          python scripts/pass2_hard_structures.py --workdir harvest/batches/stacks-second-2026-10-28
          python scripts/harvest_pipeline.py status --workdir harvest/batches/stacks-bulk-2026-10-28
          python scripts/harvest_pipeline.py status --workdir harvest/batches/stacks-second-2026-10-28
      - name: Commit reviewed statement data and unresolved queues only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28
          git diff --cached --quiet || (git commit -m "Pass 2: record equivalences, compound clauses and hard-case follow-up" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-harder-structure-summaries
          path: |
            harvest/batches/stacks-bulk-2026-10-28/pass2_hard_summary.json
            harvest/batches/stacks-second-2026-10-28/pass2_hard_summary.json
          retention-days: 90
