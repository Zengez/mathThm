name: Four complete consecutive Stacks chapters — source context draft scale test
on:
  push:
    paths:
      - .github/workflows/section-walk-four-complete-chapters.yml
      - scripts/stacks_four_complete_chapters.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maththm-four-complete-chapters
  cancel-in-progress: false
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: stacks/stacks-project
          ref: a04446e57ec1fbc252a871afcec7752fb2807b14
          path: upstream/stacks
          persist-credentials: false
      - run: test "$(git -C upstream/stacks rev-parse HEAD)" = "a04446e57ec1fbc252a871afcec7752fb2807b14"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct every candidate in four entirely complete chapters
        run: python -m scripts.stacks_four_complete_chapters
      - name: Run existing Python regression suite
        run: python -m unittest discover -s tests -q
      - name: Confirm corpus and immutable Pass 1/2 source data unchanged
        run: |
          test -z "$(git diff --name-only -- data/theorems.json harvest/batches harvest/active_candidate_ids.jsonl)"
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("harvest/section_walk_four_chapters_2026-10-28")
          v=json.loads((r/"VALIDATION.json").read_text())
          m=json.loads((r/"MANIFEST.json").read_text())
          assert v["passed"] and v["all_four_chapters_whole"] and v["source_environment_frames_balanced"]
          assert m["sections"]>0 and m["active_candidate_count"]>0
          print("validated",m["source_chapters"],m["sections"],m["active_candidate_count"])
          PY
      - name: Save section checkpoints, candidate drafts, report and registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/section_walk_four_chapters_2026-10-28/ harvest/SECTION_WALK_COMPLETED_SECTIONS.json
          git diff --cached --quiet && exit 0
          git commit -m "Checkpoint four complete Stacks chapters with standalone source-context draft overlays"
          git pull --rebase origin main
          git push origin main
