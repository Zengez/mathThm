name: Pass 2 recover embedded named Situation context
on:
  push:
    paths:
      - .github/workflows/pass2-context-flexible.yml
      - scripts/pass2_context_flexible_situations.py
      - tests/test_pass2_context_flexible_situations.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source-statement and existing regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch exact pinned Stacks text, no proof inspection
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --filter=blob:none https://github.com/stacks/stacks-project.git upstream/stacks
          REF=a04446e57ec1fbc252a871afcec7752fb2807b14
          if [ "$(git -C upstream/stacks rev-parse HEAD)" != "$REF" ]; then
            git -C upstream/stacks fetch --quiet --depth 1 origin "$REF"
            git -C upstream/stacks checkout --quiet --detach "$REF"
          fi
          test "$(git -C upstream/stacks rev-parse HEAD)" = "$REF"
      - name: Resolve early references to named Situation in Let statements
        run: python -m scripts.pass2_context_flexible_situations --source-root upstream/stacks
      - name: Audit all Pass 2 records and output current rollup
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from scripts import harvest_pipeline as p
          all_status=Counter();summaries=[]
          for batch in ('stacks-bulk-2026-10-28','stacks-second-2026-10-28','stacks-remaining-2026-10-28'):
              w=Path('harvest/batches')/batch
              a=p.load_rows(w/'pass1.jsonl','candidate_id')
              b=p.load_rows(w/'pass2.jsonl','candidate_id')
              assert set(a)==set(b)
              count=Counter(x['context_status'] for x in b.values())
              all_status.update(count)
              for v in b.values():
                  if v['context_status']=='resolved':assert v['hypotheses'] and v['conclusions']
                  if v.get('logical_form','').startswith('equivalence'):
                      assert all(x in v['hypotheses'] and x in v['conclusions']
                         for side in v.get('equivalence_sides',[]) for x in side)
              assert len(p.load_rows(w/'pass3.jsonl','candidate_id'))==0
              summaries.append({'batch':batch,'candidates':len(a),'status':dict(sorted(count.items()))})
          rollup={'candidates':sum(v['candidates'] for v in summaries),
                  'statuses':dict(sorted(all_status.items())),'batches':summaries,
                  'proofs_read':False,'public_catalog_untouched':True}
          assert rollup['candidates']==10987
          p.atomic_text(Path('harvest/PASS2_ALL_STACKS_CURRENT_2026-10-28.json'),
                        json.dumps(rollup,indent=2,sort_keys=True)+'\n')
          print(json.dumps(rollup,indent=2,sort_keys=True))
          PY
      - name: Commit Pass 2 records and remaining queues, not theorem catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28 harvest/batches/stacks-remaining-2026-10-28 harvest/PASS2_ALL_STACKS_CURRENT_2026-10-28.json
          git diff --cached --quiet || (git commit -m "Pass 2: recover additional pinned Situation references in source setup" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-flexible-situation-review
          path: |
            harvest/batches/*/pass2_context_flexible_situations_summary.json
            harvest/PASS2_ALL_STACKS_CURRENT_2026-10-28.json
          retention-days: 90
