name: Pass 2 pinned source context probe
on:
  push:
    paths:
      - .github/workflows/pass2-source-probe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned Stacks statements without proof review
        run: |
          git clone --quiet --depth 1 --filter=blob:none https://github.com/stacks/stacks-project.git upstream/stacks
          REF=a04446e57ec1fbc252a871afcec7752fb2807b14
          if [ "$(git -C upstream/stacks rev-parse HEAD)" != "$REF" ]; then
            git -C upstream/stacks fetch --quiet --depth 1 origin "$REF"
            git -C upstream/stacks checkout --quiet --detach "$REF"
          fi
          test "$(git -C upstream/stacks rev-parse HEAD)" = "$REF"
      - name: Inventory source-native named statement context
        run: python scripts/pass2_context_source_probe.py
      - name: Store bounded context samples, no candidate decisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/PASS2_CONTEXT_SOURCE_PROBE_2026-10-28.json
          git diff --cached --quiet || (git commit -m "Probe named source context for remaining Stacks Pass 2 cases" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-pinned-source-context-probe
          path: harvest/PASS2_CONTEXT_SOURCE_PROBE_2026-10-28.json
          retention-days: 90
