name: Validate 300 candidates in 54 consecutive Stacks sections
on:
  push:
    paths:
      - .github/workflows/validate-stacks-section-walk-scale300.yml
      - scripts/validate_stacks_section_walk_scale300.py
      - scripts/stacks_section_walk_scale300_reconstruct.py
      - harvest/SECTION_WALK_COMPLETED_SECTIONS.json
      - harvest/section_walk_scale300_2026-10-28/SCOPES_REVIEWED.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 300 individual standalone drafts, 54 complete sections and chapter reset
        run: python -m scripts.validate_stacks_section_walk_scale300
      - name: All Python regression tests, including logical scope cases
        run: python -m unittest discover -s tests -q
      - name: Persist 54 complete-section checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/section_walk_scale300_2026-10-28/SECTION_CHECKPOINTS.jsonl harvest/section_walk_scale300_2026-10-28/VALIDATION.json
          test -z "$(git diff --name-only -- data/theorems.json harvest/batches harvest/active_candidate_ids.jsonl)"
          if ! git diff --cached --quiet; then
            git commit -m "Record validated section-complete checkpoints and source scope audit for 300 theorem drafts"
            git pull --rebase origin main
            git push origin main
          fi
