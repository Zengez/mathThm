name: Pass 2 hard-case follow-up and search audit
on:
  push:
    paths:
      - .github/workflows/pass2-hard-followup.yml
      - scripts/pass2_hard_followup.py
      - tests/test_pass2_hard_followup.py
      - tests/test_pass2_hard_structures.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pass2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify statement logical-form rules and prior tests
        run: python -m unittest discover -s tests -v
      - name: Handle deferred forms and repair clause-specific search
        run: |
          set -euo pipefail
          python scripts/pass2_hard_followup.py --workdir harvest/batches/stacks-bulk-2026-10-28
          python scripts/pass2_hard_followup.py --workdir harvest/batches/stacks-second-2026-10-28
          python scripts/harvest_pipeline.py status --workdir harvest/batches/stacks-bulk-2026-10-28
          python scripts/harvest_pipeline.py status --workdir harvest/batches/stacks-second-2026-10-28
      - name: Commit updated Pass 2 decisions and bounded review queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28
          git diff --cached --quiet || (git commit -m "Refine hard Pass 2 statements and preserve per-case search logic" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-hard-followup-summaries
          path: |
            harvest/batches/stacks-bulk-2026-10-28/pass2_hard_followup_summary.json
            harvest/batches/stacks-second-2026-10-28/pass2_hard_followup_summary.json
          retention-days: 90
