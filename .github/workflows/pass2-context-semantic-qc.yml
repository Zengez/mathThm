name: Pass 2 inherited context source-logical QA gate
on:
  push:
    paths:
      - .github/workflows/pass2-context-semantic-qc.yml
      - scripts/pass2_context_semantic_qc_new.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all Pass 2 tests
        run: python -m unittest discover -s tests -q
      - name: Preserve any ambiguous biconditionals as unresolved
        run: python -m scripts.pass2_context_semantic_qc_new
      - name: Rebuild canonical queues and totals
        run: python -m scripts.pass2_resume_queues
      - name: Check the context-only invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('harvest/PASS2_CONTEXT_LOGICAL_QC_2026-10-28.json').read_text())
          i=json.loads(Path('harvest/PASS2_RESUME_INVENTORY_2026-10-28.json').read_text())
          assert r['status_totals']==i['all_statuses']
          assert r['status_totals']['needs_structure']==475
          assert r['status_totals']['needs_classification']==3
          assert not r['proofs_read'] and r['published_catalog_unchanged']
          PY
      - name: Save only corrected Pass 2 decisions and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28 harvest/batches/stacks-remaining-2026-10-28 harvest/PASS2_RESUME_INVENTORY_2026-10-28.json harvest/PASS2_CONTEXT_LOGICAL_QC_2026-10-28.json
          if ! git diff --cached --quiet; then
            git commit -m "Pass 2: defer unindexed equivalences and source placeholders"
            git pull --rebase origin main
            git push origin main
          fi
