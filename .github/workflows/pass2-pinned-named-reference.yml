name: Pass 2 pinned named lemma context follow-up
on:
  push:
    paths:
      - .github/workflows/pass2-pinned-named-reference.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all Pass 2 and original pipeline regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch original Stacks text at exact source revision
        run: |
          git clone --quiet --depth 1 --filter=blob:none https://github.com/stacks/stacks-project.git upstream/stacks
          REF=a04446e57ec1fbc252a871afcec7752fb2807b14
          if [ "$(git -C upstream/stacks rev-parse HEAD)" != "$REF" ]; then
            git -C upstream/stacks fetch --quiet --depth 1 origin "$REF"
            git -C upstream/stacks checkout --quiet --detach "$REF"
          fi
          test "$(git -C upstream/stacks rev-parse HEAD)" = "$REF"
      - name: Contextual Pass 2 split with exact prior same-file named lemma
        run: |
          set -euo pipefail
          python -m scripts.pass2_pinned_named_reference --source-root upstream/stacks
      - name: Validate statuses and source preservation
        run: |
          python - <<'PY'
          from scripts import harvest_pipeline as p
          from pathlib import Path
          from collections import Counter
          import json
          b=('stacks-bulk-2026-10-28','stacks-second-2026-10-28','stacks-remaining-2026-10-28')
          counts=Counter();pieces=[]
          for batch in b:
              root=Path('harvest/batches')/batch
              a=p.load_rows(root/'pass1.jsonl','candidate_id')
              c=p.load_rows(root/'pass2.jsonl','candidate_id')
              assert set(a)==set(c)
              assert len(p.load_rows(root/'pass3.jsonl','candidate_id'))==0
              local=Counter(v['context_status'] for v in c.values())
              counts.update(local)
              for v in c.values():
                  if v['context_status']=='resolved':
                      assert v['hypotheses'] and v['conclusions']
                  if v.get('logical_form','').startswith('equivalence') or 'equivalence' in v.get('logical_form',''):
                      assert all(side in v['hypotheses'] and side in v['conclusions']
                          for group in v.get('equivalence_sides',[]) for side in group)
              pieces.append({'batch':batch,'count':len(a),'statuses':dict(local)})
          out={'batches':pieces,'candidates':sum(x['count'] for x in pieces),
               'statuses':dict(sorted(counts.items())),
               'no_proofs_read':True,'no_pass3_records':True,'no_published_catalog_changes':True}
          assert out['candidates']==10987
          p.atomic_text(Path('harvest/PASS2_ALL_STACKS_LATEST_2026-10-28.json'),
             json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit scoped Pass 2 decisions and counters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28 harvest/batches/stacks-remaining-2026-10-28 harvest/PASS2_ALL_STACKS_LATEST_2026-10-28.json
          if ! git diff --cached --quiet; then
            git commit -m "Pass 2: split exact source named-lemma referenced Stacks statements"
            git pull --rebase origin main
            git push origin main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-pinned-named-source-followup
          path: |
            harvest/batches/*/pass2_pinned_named_reference_summary.json
            harvest/PASS2_ALL_STACKS_LATEST_2026-10-28.json
          retention-days: 90
