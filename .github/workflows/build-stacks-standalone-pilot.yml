name: Assemble bounded standalone-context candidate trial
on:
  push:
    paths:
      - .github/workflows/build-stacks-standalone-pilot.yml
      - scripts/stacks_standalone_pilot.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  packet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble read-only canonical candidate source-context packets
        run: python -m scripts.stacks_standalone_pilot
      - name: Check all provisional merges and no original mutation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import harvest_pipeline as p
          r=p.read_jsonl(Path("harvest/standalone_context_pilot_2026-10-28_packets.jsonl"))
          m=json.loads(Path("harvest/standalone_context_pilot_2026-10-28_manifest.json").read_text())
          assert 10<=len(r)<=21
          assert m["provisional_duplicate_groups_included"]==8
          assert len({z["candidate_id"] for z in r})==len(r)
          assert m["semantic_standalone_reviews_complete"]==0
          assert not m["pass2_candidates_modified"]
          assert all(z["hypotheses_not_modified"] and z["source_proofs_not_read"] for z in r)
          assert all(z["source_revision"]==m["source_revision"] for z in r)
          assert all(z["current_section"] for z in r)
          print(json.dumps({"candidates":len(r),"merges":8,
             "chapters":m["chapters_in_sample"],
             "resolved_refs":m["resolved_exact_reference_leads"]},sort_keys=True))
          PY
      - name: Save pilot review queue only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/standalone_context_pilot_2026-10-28_packets.jsonl harvest/standalone_context_pilot_2026-10-28_manifest.json
          test -z "$(git diff --name-only -- data/theorems.json harvest/batches harvest/active_candidate_ids.jsonl)"
          if ! git diff --cached --quiet; then
            git commit -m "Save bounded independent standalone-context candidate trial packets"
            git pull --rebase origin main
            git push origin main
          fi
