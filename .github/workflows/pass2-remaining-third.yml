name: Pass 2 third structural review of 710 remaining Stacks entries
on:
  push:
    paths:
      - .github/workflows/pass2-remaining-third.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute Python grammar, harvesting, and logical-form regression tests
        run: python -m unittest discover -s tests -v
      - name: Review source-equivalence addenda and scoped conditional cases
        run: |
          set -euo pipefail
          python scripts/pass2_hard_followup.py --workdir harvest/batches/stacks-remaining-2026-10-28
      - name: Run targeted second interpretation of remaining source statements
        run: |
          set -euo pipefail
          python scripts/pass2_remaining_targeted.py --workdir harvest/batches/stacks-remaining-2026-10-28
      - name: Audit counts across all three Stacks harvest batches
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from scripts import harvest_pipeline as p
          root=Path('harvest/batches')
          batches=('stacks-bulk-2026-10-28','stacks-second-2026-10-28','stacks-remaining-2026-10-28')
          rows=[]
          before=710
          for batch in batches:
              w=root/batch
              raw=p.load_rows(w/'pass1.jsonl','candidate_id')
              current=p.load_rows(w/'pass2.jsonl','candidate_id')
              assert set(raw)==set(current),(batch,len(raw),len(current))
              counts=Counter(x['context_status'] for x in current.values())
              for v in current.values():
                  if v['context_status']=='resolved':
                      assert v['hypotheses'] and v['conclusions'],v['candidate_id']
                  if v.get('logical_form','').startswith('equivalence'):
                      sides=[y for side in v.get('equivalence_sides',[]) for y in side]
                      assert all(y in v['hypotheses'] and y in v['conclusions'] for y in sides),v['candidate_id']
              rows.append({'batch':batch,'candidates':len(raw),'statuses':dict(sorted(counts.items())),'pass3':len(p.load_rows(w/'pass3.jsonl','candidate_id'))})
          counts=sum((Counter(r['statuses']) for r in rows),Counter())
          assert rows[2]['candidates']==7865
          assert rows[2]['statuses'].get('needs_context',0)==1654
          assert rows[2]['statuses'].get('needs_classification',0)==3
          assert rows[2]['statuses'].get('needs_structure',0)<=before
          assert all(r['pass3']==0 for r in rows)
          result={'batch_summaries':rows,
                  'total_candidates':sum(r['candidates'] for r in rows),
                  'status_totals':dict(sorted(counts.items())),
                  'original_new_harvest_structural_queue':before,
                  'new_harvest_structural_queue_remaining':rows[2]['statuses'].get('needs_structure',0),
                  'additional_splits_this_run':before-rows[2]['statuses'].get('needs_structure',0),
                  'proofs_read':False,'mathematical_validity_assessed':False,
                  'pass3_unchanged':True,'public_catalog_unchanged':True}
          p.atomic_text(Path('harvest/PASS2_ALL_STACKS_COUNTS_2026-10-28.json'),
                         json.dumps(result,indent=2,sort_keys=True)+'\n')
          p.refresh_needs(root/'stacks-remaining-2026-10-28')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - name: Save only Pass 2 review records, queues, and global status counters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-remaining-2026-10-28 harvest/PASS2_ALL_STACKS_COUNTS_2026-10-28.json
          git diff --cached --quiet || (git commit -m "Pass 2: review 710 Stacks structural cases and summarize all three harvests" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-third-stacks-and-global-counts
          path: |
            harvest/batches/stacks-remaining-2026-10-28/pass2_hard_followup_summary.json
            harvest/batches/stacks-remaining-2026-10-28/pass2_targeted_summary.json
            harvest/PASS2_ALL_STACKS_COUNTS_2026-10-28.json
          retention-days: 90
