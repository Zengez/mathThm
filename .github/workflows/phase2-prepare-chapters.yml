name: Phase 2 - prepare Stacks chapter review inputs
on:
  push:
    branches:
      - feature/phase2-chapter-preparation
    paths:
      - .github/workflows/phase2-prepare-chapters.yml
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      chapters:
        description: "all or comma-separated *.tex chapter names"
        required: true
        default: all
        type: string
      max_chapters:
        description: "Maximum new chapters (0 = all)"
        required: true
        default: "12"
        type: string
      persist:
        description: "Commit prepared chapters to this isolated branch"
        required: true
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: phase2-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: stacks/stacks-project
          ref: a04446e57ec1fbc252a871afcec7752fb2807b14
          path: upstream/stacks
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests, prepare once, validate once, optionally commit
        env:
          CHAPTERS: ${{ inputs.chapters }}
          MAX_CHAPTERS: ${{ inputs.max_chapters }}
          PERSIST: ${{ inputs.persist }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == feature/phase2-chapter-preparation || "$GITHUB_REF_NAME" == data/phase2-prepared ]] || exit 1
          test "$(git -C upstream/stacks rev-parse HEAD)" = a04446e57ec1fbc252a871afcec7752fb2807b14
          python -m unittest discover -s tests -q
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            chapters=all
            maximum=0
            persist=true
          else
            chapters="$CHAPTERS"
            maximum="$MAX_CHAPTERS"
            persist="$PERSIST"
          fi
          [[ "$maximum" =~ ^[0-9]+$ ]] || exit 1
          python -m scripts.phase2_prepare_chapters --chapters "$chapters" --only-missing --max-chapters "$maximum"
          python -m scripts.phase2_verify_prepared --source-root upstream/stacks
          if [[ "$persist" == true ]]; then
            git add harvest/phase2_prepared/
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Prepare pending Stage A chapters"
              git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
            fi
          fi
