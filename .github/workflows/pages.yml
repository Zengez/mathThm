name: Publish mathThm
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild nightly so mathDef definition snapshots can refresh automatically.
    - cron: '17 5 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: maththm-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://zengez.github.io/mathThm/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize already-approved Phase 2 records from canonical master
        run: |
          python scripts/publish_phase2_catalog.py --all
          cat work/phase2-final-publication/REPORT.json
      - name: Check frontend scripts
        run: |
          node --check web/search-core.js
          node --check web/app.js
          node --check web/mathdef-v2.js
          node --check web/definition-links.js
      - name: Test theorem search
        run: node --test tests/test_search.cjs tests/test_ui_smoke.cjs tests/test_mathdef_v2.cjs tests/test_definition_links.cjs
      - name: Validate theorem records
        run: python -m unittest discover -s tests -v
      - name: Build site and optionally bundle mathDef definitions
        run: python scripts/build_site.py
      - name: Verify generated site
        run: |
          test -f _site/index.html
          test -f _site/theorems.json
          test -f _site/search-core.js
          test -f _site/app.js
          test -f _site/mathdef-v2.js
          test -f _site/definition-links.js
          test -f _site/mathdef-snapshot.json
          test -f _site/mathdef-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_site import validate_v2,verify_theorem_hints
          root=Path('_site')
          manifest=json.loads((root/'mathdef-manifest.json').read_text())
          snapshot=validate_v2(manifest,(root/'mathdef-snapshot.json').read_bytes())
          corpus=json.loads((root/'theorems.json').read_text())
          assert manifest['dataset']=='merged'
          assert verify_theorem_hints(snapshot,corpus)>0
          print("PUBLISHED_MATHTHM_DEFINITIONS="+json.dumps({
            'terms':len(snapshot['definitions']),
            'meanings':manifest['meaning_count'],
            'formulations':manifest['formulation_count'],
            'historic_original_ids':manifest['original_definition_count'],
            'version':manifest['version'],
          },sort_keys=True))
          PY
      - name: Install browser smoke adapter
        run: npm install --prefix /tmp/maththm-browser --no-audit --no-fund playwright-core@1.56.1
      - name: Browser-test canonical v2 theorem definition expansion
        run: |
          python -m http.server 8766 --directory _site >/tmp/maththm-http.log 2>&1 &
          MATHTHM_SITE_ROOT=_site MATHTHM_SITE_URL=http://127.0.0.1:8766/ node tests/test_v2_browser.cjs
      - name: Persist published catalog, shard outputs and admission report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/theorems.json work/phase2-final-publication/REPORT.json \
            work/phase2-final-publication/BLOCKERS.json \
            work/phase2-final-publication/shards/worker-1.json \
            work/phase2-final-publication/shards/worker-2.json \
            work/phase2-final-publication/shards/worker-3.json \
            work/phase2-final-publication/shards/worker-4.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist published canonical Phase 2 theorem catalog'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
