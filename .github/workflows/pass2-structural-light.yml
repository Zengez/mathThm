name: Pass 2 second structural interpretation
on:
  push:
    paths:
      - .github/workflows/pass2-structural-light.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Retry previously unresolved structural Pass 2 entries only
        run: |
          set -euo pipefail
          python scripts/pass2_structural_light.py --workdir harvest/batches/stacks-bulk-2026-10-28
          python scripts/pass2_structural_light.py --workdir harvest/batches/stacks-second-2026-10-28
      - name: Commit outcomes and higher-thinking queues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest/batches/stacks-bulk-2026-10-28 harvest/batches/stacks-second-2026-10-28
          git diff --cached --quiet || (git commit -m "Save bounded structural Pass 2 splits and higher-thinking review queues" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-structural-summaries
          path: |
            harvest/batches/stacks-bulk-2026-10-28/pass2_structural_summary.json
            harvest/batches/stacks-second-2026-10-28/pass2_structural_summary.json
          retention-days: 90
